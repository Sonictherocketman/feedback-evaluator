[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-evaluator"
version = "0.1.0"
description = "Evaluate academic papers with a Claude Code agent, embed the feedback lines, and compare the embeddings."
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "anyio",
    "httpx",
    "numpy",
    "PyYAML",
    "pypdf",
    "fonttools",  # pypdf: decode CFF/Type1 fonts (standard in TeX PDFs)
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["pytest", "pytest-cov", "black", "semgrep"]

[project.scripts]
feedback_evaluator = "feedback_evaluator.cli:main"

[tool.setuptools]
packages = ["feedback_evaluator"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=feedback_evaluator --cov-report=term-missing"

[tool.black]
line-length = 79
target-version = ["py310"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | feedback_evaluator\.egg-info
)/
'''
